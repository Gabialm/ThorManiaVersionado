<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThorMania</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<header class="header-adocao">
    <div class="container d-flex justify-content-between align-items-center">
        
        <div class="logo-area">
            <i class="fas fa-heart heart-icon">
                <i class="fas fa-paw paw-inside"></i>
            </i>
            <span class="logo-text">ThorMania</span>
            
        </div>

        <div class="icons-area">
            <i class="fas fa-search search-icon"></i>
           <button class="menu-circle btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuLateral">
            <i class="fas fa-bars"></i>
        </button>
        </div>
        
    </div>
</header>
<div class="offcanvas offcanvas-end" tabindex="-1" id="menuLateral" aria-labelledby="offcanvasLabel">
  <div class="offcanvas-header">
   <div class="offcanvas-header">
  <h5 class="offcanvas-title" id="offcanvasLabel">
    <i class="fas fa-heart heart-icon" style="position: relative; color: rgb(243, 37, 140);">
        <i class="fas fa-paw paw-inside" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 0.5em; color: #ffffff;"></i>
    </i>
    <span style="margin-left: 10px;">ThorMania</span>
  </h5>
</div>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">
    <p>Bem-vindo ao ThorMania!</p>
    <div class="list-group list-group-flush">
      <a href="#" class="list-group-item list-group-item-action">Início</a>
      <a href="#" class="list-group-item list-group-item-action">Meu Perfil</a>
      <a href="#" class="list-group-item list-group-item-action"> Quem Somos</a>
    </div>
  </div>
</div>

<div class="container my-4">
    <div class="row g-2 justify-content-center">
        
        <div class="col-6 col-md-3">
            <a href="#" class="card-link">
                <div class="card h-100 card-menu">
                    <div class="card-body">
                        <img src="imagens/icoAdotar.webp" alt="Adotar">
                        <span class="card-text">ADOTAR</span>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-6 col-md-3">
            <a href="#" class="card-link">
                <div class="card h-100 card-menu">
                    <div class="card-body">
                        <img src="imagens/icoDoar.webp" alt="Doar">
                        <span class="card-text">DOAR</span>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-6 col-md-3">
            <a href="#" class="card-link">
                <div class="card h-100 card-menu">
                    <div class="card-body">
                        <img src="imagens/icoFeirasAdocao.webp" alt="Feiras">
                        <span class="card-text">FEIRAS DE ADOÇÃO</span>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-6 col-md-3">
            <a href="#" class="card-link">
                <div class="card h-100 card-menu">
                    <div class="card-body">
                        <img src="imagens/icoPerdi.webp" alt="Perdi">
                        <span class="card-text">PERDI UM PET</span>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-6 col-md-3">
            <a href="#" class="card-link">
                <div class="card h-100 card-menu">
                    <div class="card-body">
                        <img src="imagens/icoEncontrei.webp" alt="Encontrei">
                        <span class="card-text">ENCONTREI UM PET</span>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-6 col-md-3">
            <a href="#" class="card-link">
                <div class="card h-100 card-menu">
                    <div class="card-body">
                        <img src="imagens/icoBlog.webp" alt="Blog">
                        <span class="card-text">BLOG</span>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-6 col-md-3">
            <a href="#" class="card-link">
                <div class="card h-100 card-menu">
                    <div class="card-body">
                        <img src="imagens/icoONGs.webp" alt="ONGs">
                        <span class="card-text">ONGS</span>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-6 col-md-3">
            <a href="#" class="card-link">
                <div class="card h-100 card-menu">
                    <div class="card-body">
                        <img src="imagens/icoCadastrarEventos.webp" alt="Evento">
                        <span class="card-text">CADASTRAR EVENTO</span>
                    </div>
                </div>
            </a>
        </div>

    </div>
</div>
    
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
